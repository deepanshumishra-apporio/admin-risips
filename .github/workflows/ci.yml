# Put this file in deepanshumishra-apporio/admin-risips at .github/workflows/ci.yml
# (and delete deploy-admin.yml if it was ever added: it deployed from main, which AWS no longer trusts).
#
#   push / PR to dev  -> checks (typecheck + production build)
#   push to prod      -> checks, then deploy that commit to the AWS admin server (admin-web: built on the server,
#                        rolls back by itself if the new build doesn't answer). Only Akash's pushes deploy: the job's
#                        guard refuses anyone else, and AWS refuses them too (role risips-admin-deployer trusts only
#                        prod + actor akashatbest).
#
# Branch rule: Deepanshu works on dev; Akash reviews and merges dev into prod, which is the approval.
name: CI / deploy

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # only the deploy job uses it: GitHub proves to AWS which repo, branch and pusher this is

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      ADMIN_API_URL: http://127.0.0.1:3005   # read at runtime only; set so a build-time read can't fail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same install as the server's deploy.sh: npm ci with a package-lock.json, npm install without one.
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm run build

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-admin-web
      cancel-in-progress: false
    steps:
      - name: Only Akash deploys
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != akashatbest ]; then
            echo "::error::Only akashatbest deploys the admin. Push to dev; Akash merges dev into prod."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::803888670689:role/risips-admin-deployer
          aws-region: ap-south-1

      - name: Deploy ${{ github.sha }} on the admin server
        env:
          INSTANCE: i-0e1d8cf3687f28291
        run: |
          CID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "admin-web ${GITHUB_SHA::7}" \
            --parameters "commands=[\"/opt/admin/bin/deploy.sh ${GITHUB_SHA}\"],executionTimeout=[\"1800\"]" \
            --query Command.CommandId --output text)
          echo "SSM command $CID"
          S=Pending
          for i in $(seq 1 180); do
            sleep 10
            S=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$S" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE" \
            --query "[StandardOutputContent,StandardErrorContent]" --output text | tail -60
          echo "Status: $S"
          [ "$S" = Success ]
